# OpenCATS preview gateway — ENVIRONMENT-ONLY. Not part of the application.
#
# Sits between the public HTTPS tunnel and the unmodified OpenCATS web container.
# It does not change application code; it only:
#   * marks every page as a non-production preview (banner injected into HTML responses),
#   * keeps the browser on HTTPS (the app builds absolute http:// URLs from the Host header),
#   * refuses to execute scripts from upload folders and to serve maintenance/installer
#     scripts that have no place in a public demo,
#   * adds no-index / no-cache headers so the demo is not indexed.
# Works with the official nginx image (runner) and prooph/nginx:www (local tests).

user nginx;
worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx-gateway.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;

    # The tunnel terminates TLS and sends X-Forwarded-Proto: https; local tests use plain http.
    map $http_x_forwarded_proto $preview_scheme {
        default $scheme;
        https   https;
    }

    upstream opencats_app { server web:80; }

    server {
        listen 8080;
        server_name _;
        client_max_body_size 8m;

        # Scripts must never run from upload/storage folders (defence in depth for a public demo).
        location ~* ^/(attachments|upload|temp)/.*\.(php[0-9]?|phtml|phar|pl|py|cgi|sh)$ { return 403; }

        # Installer / maintenance / developer scripts are not part of the demo surface.
        location ~* ^/(installtest\.php|installwizard\.php|rebuild_old_docs\.php|QueueCLI\.php|scripts/|optional-updates/|modules/install/|ci/|test/|docker/|docs/|vendor/.*\.php$|composer\.(json|lock)|INSTALL_BLOCK|config\.php) { return 404; }

        location / {
            proxy_pass http://opencats_app;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $preview_scheme;
            # Needed so the banner can be injected (sub_filter only works on uncompressed bodies).
            proxy_set_header Accept-Encoding "";
            proxy_read_timeout 120s;

            # The app issues absolute http:// redirects built from the Host header.
            proxy_redirect http://$http_host/ $preview_scheme://$http_host/;

            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header X-OpenCATS-Environment "preview-demo" always;

            sub_filter_types text/html;
            sub_filter_once off;
            sub_filter 'http://$http_host/' '$preview_scheme://$http_host/';
            # Visible non-production marker; only on top-level pages (not inside the app's popup iframes).
            sub_filter '</body>' '<script>(function(){try{if(window.top!==window.self)return;var b=document.createElement("div");b.setAttribute("role","note");b.id="opencats-preview-banner";b.textContent="OpenCATS Preview — Demo Environment · fictional data · not production · e-mail is not delivered";b.style.cssText="position:sticky;top:0;z-index:2147483647;background:#7a1f00;color:#fff;font:bold 13px/1.4 Arial,Helvetica,sans-serif;text-align:center;padding:6px 8px;letter-spacing:.2px";document.body.insertBefore(b,document.body.firstChild);document.title="[PREVIEW] "+document.title;}catch(e){}})();</script></body>';
        }
    }
}
