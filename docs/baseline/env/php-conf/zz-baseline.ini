; OpenCATS Phase 0.5 baseline — ENVIRONMENT-ONLY PHP settings. Not part of the application.
; Mounted into the php container at /usr/local/etc/php/conf.d/zz-baseline.ini.
;
; The tracked config.php uses DATABASE_HOST = 'localhost'. For mysqli, 'localhost' means
; "connect through the Unix socket", so the MariaDB socket is shared into the php container
; through a volume and made the default socket here. This avoids editing config.php.
mysqli.default_socket = /run/mysqld/mysqld.sock
pdo_mysql.default_socket = /run/mysqld/mysqld.sock

; Also write PHP errors to a file so they can be collected. This does not change what the
; browser sees: the image has no php.ini, so display_errors stays at the PHP default (On)
; and error_reporting at the PHP 7.2 default (E_ALL & ~E_NOTICE & ~E_STRICT & ~E_DEPRECATED).
log_errors = On
error_log = /var/log/php-baseline/php_errors.log
